<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Silhouette Shape Identification Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen font-sans text-white">
<div class="max-w-xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-center text-teal-400 mb-1">Country Silhouette Quiz</h1>
  <p class="text-center text-slate-400 mb-6">Identify the country from its shape</p>

  <!-- Difficulty + Stats -->
  <div class="flex flex-wrap gap-3 justify-between items-center mb-4">
    <div>
      <label for="difficulty" class="text-sm text-slate-400 mr-1">Difficulty:</label>
      <select id="difficulty" class="bg-slate-800 border border-slate-600 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400" aria-label="Select difficulty">
        <option value="easy">Easy (4 options)</option>
        <option value="medium" selected>Medium (4, less obvious)</option>
        <option value="hard">Hard (6 options)</option>
      </select>
    </div>
    <div class="flex gap-4 text-sm text-slate-300">
      <span>Score: <strong id="score" class="text-white">0</strong></span>
      <span>Streak: <strong id="streak" class="text-yellow-300">0</strong></span>
    </div>
  </div>

  <!-- Silhouette card -->
  <div class="bg-slate-800 rounded-2xl p-6 mb-5 flex items-center justify-center min-h-[260px]">
    <svg id="silhouette-svg" viewBox="0 0 300 240" width="300" height="240" class="mx-auto" aria-label="Country silhouette" role="img"></svg>
  </div>

  <!-- Question -->
  <p class="text-center text-slate-300 mb-4" id="question-label">Which country is this?</p>

  <!-- Options -->
  <div id="options" class="grid grid-cols-2 gap-3 mb-4"></div>

  <!-- Feedback -->
  <div class="text-center h-8 font-semibold text-base" id="feedback" aria-live="assertive"></div>

  <!-- Counter -->
  <div class="text-center text-sm text-slate-500 mt-1">Questions: <strong id="total" class="text-slate-300">0</strong></div>
</div>

<script>

    hint: 'Archipelago nation stretching across Southeast Asia'
  },
];

// Easy uses famous/very distinct shapes, Medium uses all, Hard adds more options
const EASY_COUNTRIES = ['Italy','Australia','India','USA','Chile','New Zealand','Japan','Argentina'];

let mode_diff = 'medium';
let score = 0, streak = 0, total = 0;
let answered = false;
let current = null;

function shuffle(arr) {
  const a = [...arr]; for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a;
}

function getPool() {
  if (mode_diff === 'easy') return COUNTRIES.filter(c => EASY_COUNTRIES.includes(c.name));
  return COUNTRIES;
}

function nextQuestion() {
  answered = false;
  document.getElementById('feedback').textContent = '';

  const pool = shuffle(getPool());
  current = pool[0];
  const numOptions = mode_diff === 'hard' ? 6 : 4;
  const wrongPool = pool.filter(c => c.name !== current.name);
  const wrong = wrongPool.slice(0, numOptions - 1);
  const options = shuffle([current, ...wrong]);

  // Draw silhouette
  const svg = document.getElementById('silhouette-svg');
  svg.innerHTML = '<path d="' + escapeHtml(current.path) + '" fill="#14b8a6" stroke="#0d9488" stroke-width="1.5"/>';
  svg.setAttribute('aria-label', 'Country silhouette — identify this country');

  const container = document.getElementById('options');
  container.className = numOptions === 6 ? 'grid grid-cols-2 gap-3 mb-4' : 'grid grid-cols-2 gap-3 mb-4';
  container.innerHTML = '';
  for (const opt of options) {
    const btn = document.createElement('button');
    btn.className = 'py-3 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 font-semibold text-white border-2 border-transparent transition text-sm';
    btn.textContent = opt.name;
    btn.setAttribute('aria-label', 'Answer: ' + opt.name);
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      total++;
      const correct = opt.name === current.name;
      if (correct) {
        btn.classList.add('!bg-teal-500', '!border-teal-400');
        score++; streak++;
        document.getElementById('feedback').textContent = '✓ Correct! ' + current.hint;
        document.getElementById('feedback').className = 'text-center h-8 font-semibold text-base text-teal-400';
      } else {
        btn.classList.add('!bg-red-600/70', '!border-red-500');
        streak = 0;
        document.getElementById('feedback').textContent = '✗ It was ' + current.name + '. ' + current.hint;
        document.getElementById('feedback').className = 'text-center h-8 font-semibold text-base text-red-400';
        container.querySelectorAll('button').forEach(b => {
          if (b.textContent.trim() === current.name) b.classList.add('!bg-teal-500/70');
        });
      }
      document.getElementById('score').textContent = String(score);
      document.getElementById('streak').textContent = String(streak);
      document.getElementById('total').textContent = String(total);
      setTimeout(nextQuestion, 1800);
    });
    container.appendChild(btn);
  }
}

document.getElementById('difficulty').addEventListener('change', function() {
  mode_diff = this.value;
  nextQuestion();
});

nextQuestion();
</script>
</body>
</html>
